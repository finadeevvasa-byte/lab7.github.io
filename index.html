<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея работ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="gallery-card">
        <h1>Картинки животных</h1>

        <div class="slider-container">
            <button class="arrow left-arrow" id="btn-prev">&#8592;</button>

            <div class="slider-window">
                <div class="slider-track" id="track">
                    <div class="slide"><img src="pg1.jpg" alt="Лиса"></div>
                    <div class="slide"><img src="pg2.jpg" alt="Собака"></div>
                    <div class="slide"><img src="pg3.jpg" alt="Еноты"></div>
                    <div class="slide"><img src="pg4.jpg" alt="Коты"></div>
                    <div class="slide"><img src="pg5.jpg" alt="Медведь"></div>
                    <div class="slide"><img src="pg6.jpg" alt="Заяц"></div>
                    <div class="slide"><img src="pg7.jpg" alt="Ежик"></div>
                    <div class="slide"><img src="pg8.jpg" alt="Белка"></div>
                </div>
            </div>

            <button class="arrow right-arrow" id="btn-next">&#8594;</button>
        </div>

        <div class="pager" id="pager"></div>
    </div>

</body>
</html>
